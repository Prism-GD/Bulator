name: Build Bulator APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bulator
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" SDK package; install only platform-tools here.
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Checkout upstream PRoot-RS
        uses: actions/checkout@v4
        with:
          repository: proot-me/proot-rs
          ref: master
          path: .build/proot-rs

      - name: Build PRoot-RS for Android ARM64
        working-directory: .build/proot-rs
        env:
          CARGO_BUILD_TARGET: aarch64-linux-android
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          export PATH="$TOOLCHAIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android21-clang"

          # The pinned 2021 Rust Android target still asks the linker for libgcc.
          # Modern Android NDKs use compiler-rt instead, so provide the compatible
          # builtins archive under the legacy libgcc name in the API 21 sysroot.
          BUILTINS="$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib/clang" \
            -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)"
          test -n "$BUILTINS"
          mkdir -p "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21"
          ln -sf "$BUILTINS" \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21/libgcc.a"

          # PRoot-RS pins nightly-2021-03-24; install the Android target for that toolchain too.
          rustup target add --toolchain nightly-2021-03-24 aarch64-linux-android

          # Build upstream targets directly: cargo-make defines CARGO as an empty
          # value when USE_CROSS is false, which breaks its shell build tasks.
          RUSTFLAGS="-C panic=abort -C link-self-contained=no" cargo build \
            --bin=loader-shim --features=build-binary \
            --target=aarch64-linux-android --release

          # PRoot-RS embeds the loader shim from this source-tree location.
          mkdir -p proot-rs/src/kernel/execve
          cp target/aarch64-linux-android/release/loader-shim \
            proot-rs/src/kernel/execve/loader-shim

          cargo build --bin=proot-rs --target=aarch64-linux-android --release

          file target/aarch64-linux-android/release/proot-rs
          file target/aarch64-linux-android/release/loader-shim
          readelf -h target/aarch64-linux-android/release/proot-rs | grep -E 'Class:|Machine:'
          readelf -h target/aarch64-linux-android/release/loader-shim | grep -E 'Class:|Machine:'
          test -x target/aarch64-linux-android/release/proot-rs
          test -x target/aarch64-linux-android/release/loader-shim

      - name: Package PRoot-RS in APK native assets
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp .build/proot-rs/target/aarch64-linux-android/release/proot-rs app/src/main/jniLibs/arm64-v8a/libproot-rs.so
          cp .build/proot-rs/target/aarch64-linux-android/release/loader-shim app/src/main/jniLibs/arm64-v8a/libloader-shim.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libproot-rs.so app/src/main/jniLibs/arm64-v8a/libloader-shim.so
          mkdir -p app/src/main/assets
          cp .build/proot-rs/COPYING app/src/main/assets/proot-rs-COPYING

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK contents
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(proot-rs|loader-shim).so'
          unzip -l "$APK" | grep 'proot-rs-COPYING'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bulator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
